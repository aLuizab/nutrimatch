# gitleaks config. Extends the default ruleset (which already covers Stripe keys, AWS,
# generic API keys, private keys) and adds the credential shapes specific to this project.
[extend]
useDefault = true

[[rules]]
id = "neon-postgres-url"
description = "Connection string do Postgres com senha"
regex = '''postgres(?:ql)?://[^\s:@]+:[^\s:@]+@[^\s/]+'''
tags = ["database", "credential"]

[[rules]]
id = "jwt-secret-assignment"
description = "JWT_SECRET com valor real"
regex = '''JWT_SECRET\s*=\s*["']?[A-Za-z0-9+/=_-]{32,}["']?'''
tags = ["secret"]

[allowlist]
description = "Placeholders de documentação e build — não são credenciais reais"
paths = [
  '''\.gitleaks\.toml''',
  '''\.env\.example''',
  '''MVP\.md''',
  '''DEPLOY\.md''',
  '''SECURITY\.md''',
  '''README\.md''',
]
# Estes padrões são casados contra o SEGREDO ENCONTRADO, não contra a linha inteira — e a
# regra acima termina em [^s/]+, que para na primeira barra. O segredo capturado é, portanto,
# "postgresql://build:build@localhost:5432", SEM o /build final. Listar o nome do banco aqui
# fazia a allowlist nunca casar, e os placeholders derrubavam o CI como se fossem credenciais.
# Por isso os padrões abaixo param no host: cobrem o valor com ou sem o sufixo.
regexes = [
  # Placeholder que não conecta em lugar nenhum, usado nos estágios de build do Docker.
  '''postgres(?:ql)?://build:build@localhost''',
  '''postgres(?:ql)?://ci:ci@localhost''',
  '''postgres(?:ql)?://user:password@host''',
]
